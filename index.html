<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Toma una foto, añade una descripción y comparte el print.">
  <title>FotoPrint</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>FotoPrint</h1>
    <button id="installBtn" class="ghost" hidden>Instalar</button>
  </header>

  <main>
    <!-- Paso 1: foto -->
    <section class="card">
      <div id="preview" class="preview empty">
        <span>Sin foto todavía</span>
      </div>
      <div class="row">
        <label class="btn primary">
          📷 Tomar foto
          <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
        </label>
        <label class="btn">
          🖼️ Galería
          <input id="galleryInput" type="file" accept="image/*" hidden>
        </label>
      </div>
    </section>

    <!-- Paso 2: descripción -->
    <section class="card">
      <label for="desc" class="label">Descripción</label>
      <textarea id="desc" maxlength="280" rows="3" placeholder="Ej.: Fisura en losa del eje B-3, nivel 2"></textarea>
      <div class="meta-row">
        <label class="check"><input type="checkbox" id="useDate" checked> Fecha y hora</label>
        <label class="check"><input type="checkbox" id="useGeo"> Ubicación GPS</label>
        <span id="count" class="count">0/280</span>
      </div>
      <p id="geoStatus" class="hint" hidden></p>
    </section>

    <!-- Paso 3: print -->
    <section class="card">
      <canvas id="canvas" hidden></canvas>
      <img id="result" class="result" alt="Print generado" hidden>
      <div class="row">
        <button id="shareBtn" class="btn primary" disabled>📤 Compartir</button>
        <button id="saveBtn" class="btn" disabled>💾 Guardar</button>
      </div>
      <p id="msg" class="hint"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
