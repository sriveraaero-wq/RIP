<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Toma una foto, añade una descripción y comparte el print.">
  <title>FotoPrint</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Vista previa del print (foto + descripción) -->
    <div id="stage" class="stage">
      <img id="result" class="result" alt="Vista previa del print" hidden>
      <label id="placeholder" class="placeholder" for="cameraInput">
        <span class="big">📷</span>
        <span>Toca para tomar una foto</span>
      </label>
      <button id="installBtn" class="install" hidden>Instalar</button>
    </div>

    <!-- Controles -->
    <div class="panel">
      <div class="field">
        <textarea id="desc" maxlength="280" rows="2" placeholder="Descripción…"></textarea>
        <span id="count" class="count">0/280</span>
      </div>

      <div class="opts">
        <label class="check"><input type="checkbox" id="useDate" checked> Fecha</label>
        <label class="check"><input type="checkbox" id="useGeo"> GPS</label>
        <span id="msg" class="msg"></span>
      </div>

      <div class="actions">
        <label class="btn icon" title="Galería" aria-label="Elegir de galería">
          🖼️<input id="galleryInput" type="file" accept="image/*" hidden>
        </label>
        <label class="btn icon" title="Cámara" aria-label="Tomar foto">
          📷<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
        </label>
        <button id="shareBtn" class="btn primary" disabled>📤 Enviar</button>
      </div>
    </div>
  </div>

  <canvas id="canvas" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
